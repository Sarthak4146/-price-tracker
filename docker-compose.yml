version: '3.8'

services:
  # ---------- Database ----------
  postgres:
    image: postgres:16-alpine
    container_name: price-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: price_tracker_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Backend ----------
  backend:
    build:
      context: ./backend
    container_name: price-tracker-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: price_tracker_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ThisIsASecretKeyForPriceTrackerAppChangeItInProductionPlease123456
      PRICE_CHECK_INTERVAL_MS: 900000
    ports:
      - "8080:8080"

  # ---------- Frontend ----------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: price-tracker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
