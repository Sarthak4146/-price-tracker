server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (BrowserRouter), so any path
    # that isn't a real file must fall back to index.html - otherwise
    # refreshing on e.g. /products/5/history gives an NGINX 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
