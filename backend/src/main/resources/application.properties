spring.application.name=price-tracker

# ---------- PostgreSQL ----------
# When running locally (not in Docker), change "postgres" below to "localhost"
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:price_tracker_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
# ddl-auto=update: Hibernate creates/updates tables from your @Entity classes
# automatically. Great for learning; in a real production app you'd use a
# migration tool (Flyway/Liquibase) instead, but that's outside this syllabus.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- JWT ----------
# In a real deployment, move this secret to an environment variable and
# never commit it to Git. This default is fine for local learning use.
jwt.secret=${JWT_SECRET:ThisIsASecretKeyForPriceTrackerAppChangeItInProductionPlease123456}
jwt.expiration-ms=86400000

# ---------- Scheduler ----------
# How often (ms) the background job re-checks all tracked prices. 900000 = 15 min.
price-check.interval-ms=${PRICE_CHECK_INTERVAL_MS:900000}

# ---------- Server ----------
server.port=8080
